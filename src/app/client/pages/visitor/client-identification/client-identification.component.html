
<section class="d-flex align-items-center justify-content-center identification-section">
    <div class="container" style="max-width: 70%;">
        <div class="row g-0 shadow-lg rounded-4 overflow-hidden">
            <!-- Left Side -->
            <div class="col-md-5 bg-dark text-white d-flex flex-column align-items-center justify-content-center p-5">
                <h2 class="fw-bold text-center">Welcome to SpeedRent</h2>
                <p class="mt-3 text-center">Join us today or log in to manage your rentals seamlessly.</p>
            </div>
            <!-- Right Side (Form) -->
            <div class="col-md-7 p-5 bg-white">
                <h3 class="text-center mb-4 fw-bold">{{ isSignUp ? 'Sign Up' : 'Sign In' }}</h3>
                <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
                    <div class="form-floating mb-3">
                        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Email" required>
                        <label for="email">Email</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" id="password" formControlName="password" class="form-control" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>
                    <div class="form-floating mb-3" *ngIf="isSignUp">
                        <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control" placeholder="Confirm Password" required>
                        <label for="confirmPassword">Confirm Password</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3">
                        {{ isSignUp ? 'Sign Up' : 'Sign In' }}
                    </button>
                    <div class="text-center mt-3">
                        <button type="button" class="btn btn-link" (click)="toggleAuthMode()">
                            {{ isSignUp ? 'Already have an account? Sign In' : 'Don\'t have an account? Sign Up' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
